name: Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build installer
        shell: pwsh
        run: ./build/Build-Windows.ps1
      - name: Test Library Health with Windows PowerShell 5.1
        shell: pwsh
        run: ./build/Test-Health.ps1 -DownloadTools
      - name: Test isolated installer and module packaging
        shell: pwsh
        run: ./build/tests/Health.Installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plattenkoffer-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
